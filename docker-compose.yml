services:
  ollama:
    # Versión fijada (la usada en las pruebas); actualizar a propósito, no por un pull implícito.
    image: ollama/ollama:0.40.16
    # Solo se levanta con COMPOSE_PROFILES=ollama (proveedor local).
    profiles: [ollama]
    networks: [ia]
    volumes:
      - ollama-modelos:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    restart: unless-stopped

  extractor-api:
    build: .
    networks: [ia, publica]
    ports:
      # EXTRACTOR_PUERTO acepta también ip:puerto, p. ej. 127.0.0.1:8080 para exponer solo en loopback.
      - "${EXTRACTOR_PUERTO:-8080}:8080"
    volumes:
      # Credenciales (cuenta de servicio de Vertex, CA del proxy): se montan en solo lectura.
      - ./secretos:/run/secretos:ro
    environment:
      # Se reenvían vacías si no están definidas (Spring las trata como sin definir), salvo
      # MAXTOKENS, RAZONAMIENTO y APIVERSION: un valor vacío rompe el binding o pisa el default.
      EXTRACTOR_LLM_PROVEEDOR: ${EXTRACTOR_LLM_PROVEEDOR:-}
      EXTRACTOR_AZURE_ENDPOINT: ${EXTRACTOR_AZURE_ENDPOINT:-}
      EXTRACTOR_AZURE_DEPLOYMENT: ${EXTRACTOR_AZURE_DEPLOYMENT:-}
      EXTRACTOR_AZURE_APIKEY: ${EXTRACTOR_AZURE_APIKEY:-}
      EXTRACTOR_AZURE_APIVERSION: ${EXTRACTOR_AZURE_APIVERSION:-2024-10-21}
      EXTRACTOR_AZURE_TIMEOUT: ${EXTRACTOR_AZURE_TIMEOUT:-}
      EXTRACTOR_AZURE_MAXTOKENS: ${EXTRACTOR_AZURE_MAXTOKENS:-4096}
      EXTRACTOR_AZURE_RAZONAMIENTO: ${EXTRACTOR_AZURE_RAZONAMIENTO:-false}
      EXTRACTOR_VERTEX_PROYECTO: ${EXTRACTOR_VERTEX_PROYECTO:-}
      EXTRACTOR_VERTEX_REGION: ${EXTRACTOR_VERTEX_REGION:-}
      EXTRACTOR_VERTEX_MODELO: ${EXTRACTOR_VERTEX_MODELO:-}
      EXTRACTOR_VERTEX_CREDENCIALES: ${EXTRACTOR_VERTEX_CREDENCIALES:-}
      EXTRACTOR_VERTEX_TIMEOUT: ${EXTRACTOR_VERTEX_TIMEOUT:-}
      EXTRACTOR_VERTEX_MAXTOKENS: ${EXTRACTOR_VERTEX_MAXTOKENS:-4096}
      EXTRACTOR_VERTEX_PRESUPUESTORAZONAMIENTO: ${EXTRACTOR_VERTEX_PRESUPUESTORAZONAMIENTO:-}
      EXTRACTOR_PROXY_HOST: ${EXTRACTOR_PROXY_HOST:-}
      EXTRACTOR_PROXY_PUERTO: ${EXTRACTOR_PROXY_PUERTO:-}
      EXTRACTOR_PROXY_USUARIO: ${EXTRACTOR_PROXY_USUARIO:-}
      EXTRACTOR_PROXY_CLAVE: ${EXTRACTOR_PROXY_CLAVE:-}
      EXTRACTOR_PROXY_CAEXTRA: ${EXTRACTOR_PROXY_CAEXTRA:-}
      EXTRACTOR_OLLAMA_URL: http://ollama:11434
      EXTRACTOR_OLLAMA_MODELO: ${EXTRACTOR_OLLAMA_MODELO:-qwen3-vl:4b-instruct}
      EXTRACTOR_OLLAMA_THINK: ${EXTRACTOR_OLLAMA_THINK:-false}
      EXTRACTOR_OLLAMA_TIMEOUT: ${EXTRACTOR_OLLAMA_TIMEOUT:-90s}
      EXTRACTOR_OLLAMA_NUMCTX: ${EXTRACTOR_OLLAMA_NUMCTX:-8192}
      EXTRACTOR_OLLAMA_NUMPREDICT: ${EXTRACTOR_OLLAMA_NUMPREDICT:-2048}
      EXTRACTOR_CONCURRENCIA_MAXLLM: ${EXTRACTOR_CONCURRENCIA_MAXLLM:-}
      EXTRACTOR_CONCURRENCIA_ESPERAMAXIMA: ${EXTRACTOR_CONCURRENCIA_ESPERAMAXIMA:-60s}
      EXTRACTOR_DOCUMENTO_MAXPAGINAS: ${EXTRACTOR_DOCUMENTO_MAXPAGINAS:-10}
      EXTRACTOR_DOCUMENTO_DPIIMAGEN: ${EXTRACTOR_DOCUMENTO_DPIIMAGEN:-150}
      EXTRACTOR_DOCUMENTO_DPIQR: ${EXTRACTOR_DOCUMENTO_DPIQR:-200}
      EXTRACTOR_DOCUMENTO_MAXLADOPX: ${EXTRACTOR_DOCUMENTO_MAXLADOPX:-2000}
      EXTRACTOR_DOCUMENTO_UMBRALCARACTERESPORPAGINA: ${EXTRACTOR_DOCUMENTO_UMBRALCARACTERESPORPAGINA:-50}
      EXTRACTOR_DEBUG_LOGPROMPTS: ${EXTRACTOR_DEBUG_LOGPROMPTS:-false}
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:-10MB}
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:-11MB}
      SPRING_SERVLET_MULTIPART_FILE_SIZE_THRESHOLD: ${SPRING_SERVLET_MULTIPART_FILE_SIZE_THRESHOLD:-11MB}
    depends_on:
      # Solo espera a ollama si el perfil está activo (Compose >= 2.20).
      ollama:
        condition: service_started
        required: false
    restart: unless-stopped

networks:
  ia:
    internal: true
  publica:

volumes:
  ollama-modelos:
    name: ollama-modelos
