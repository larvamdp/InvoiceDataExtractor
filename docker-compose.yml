services:
  ollama:
    image: ollama/ollama
    networks: [ia]
    volumes:
      - ollama-modelos:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: "1"
    restart: unless-stopped

  extractor-api:
    build: .
    networks: [ia, publica]
    ports:
      - "8080:8080"
    environment:
      EXTRACTOR_OLLAMA_URL: http://ollama:11434
      EXTRACTOR_OLLAMA_MODELO: ${EXTRACTOR_OLLAMA_MODELO:-qwen3-vl:4b}
      EXTRACTOR_OLLAMA_THINK: ${EXTRACTOR_OLLAMA_THINK:-false}
      EXTRACTOR_OLLAMA_TIMEOUT: ${EXTRACTOR_OLLAMA_TIMEOUT:-90s}
    depends_on:
      - ollama
    restart: unless-stopped

networks:
  ia:
    internal: true
  publica:

volumes:
  ollama-modelos:
    name: ollama-modelos
